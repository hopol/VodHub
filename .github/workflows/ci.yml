name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 语法检查：全量 PHP 文件 php -l
  # 本项目零依赖、无 composer，所以不做 install/build，只验语法与结构
  # ---------------------------------------------------------------
  lint:
    name: PHP ${{ matrix.php }} 语法检查
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo_sqlite, json, mbstring
          coverage: none

      - name: PHP 版本确认
        run: php -v

      - name: 逐文件语法检查
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=${f},title=PHP syntax error::${out}"
              echo "❌ $f"
              echo "$out"
              fail=1
            fi
          done < <(find . -name '*.php' -not -path './runtime/*' -not -path './vendor/*' -print0)
          echo ""
          echo "共检查 ${count} 个 PHP 文件"
          if [ "$fail" -ne 0 ]; then
            echo "::error::存在语法错误"
            exit 1
          fi
          echo "✅ 全部通过"

      - name: 禁止提交运行期数据
        run: |
          if git ls-files | grep -E '(^|/)(runtime/|.*\.(db|sqlite|sqlite3|log)$)'; then
            echo "::error::仓库中混入了运行期数据文件（含密码哈希 / 数据源地址），请勿提交"
            git ls-files | grep -E '(^|/)(runtime/|.*\.(db|sqlite|sqlite3|log)$)'
            exit 1
          fi
          echo "✅ 未混入运行期数据"

      - name: 模板结构完整性
        run: |
          set -euo pipefail
          # ⚠ 本步骤的清单必须与 tests/test_contracts.php 的 TPL_MUST_HAVE 一致
          #   —— 不一致就说明有人只改了一边。契约 15 钉住这件事。
          #
          #   本项目 1.3.12 起就在注释里写着「判据必须同步改，否则会一直红」，
          #   而 1.5.1 恰恰只改了契约 5 没改这里 ⇒ 1.5.3 起 5 次 CI 连红。
          #   两个来源写同一份清单，就会有「忘了同步」的那一天。
          #
          # 去重前：每套模板都必须有 9 个页面文件 + theme.json + style.css。
          # 1.3.12 去重后：只有 theme.json / style.css 是模板专属的，
          # 其余页面文件（index/list/play/search/history/login/footer/player_script
          # 与 partials/*）在 default 之外已全部删除，缺失时由
          # renderTemplate() / tplPartial() 回退到 default。
          #
          # 1.5.1 又并掉了最后一份：4 套模板的 header.php 删除，头部全站只剩
          # templates/default/header.php 一份，主题差异收进 theme.json 的
          # style / search_ph。所以 header.php **不在**下面的清单里 ——
          # 它反而**不允许**出现在非 default 模板（契约 5 有一条反向断言）。
          #
          # 为什么能删：tplInclude() 本来就有 [当前模板 → default] 的回退，
          # 且 tplExists() 的判据在 1.3.12 改成了「有 theme.json」——
          # 改之前只认 index.php，删掉 index.php 会让非 default 模板
          # **静默整个失效且不报错**。详见 includes/template.php 的注释。
          #
          # theme.json 是「这个模板存在」的标记，**不可删**。
          required="theme.json"
          fail=0
          for dir in templates/*/; do
            tpl=$(basename "$dir")
            missing=""
            for f in $required; do
              [ -f "$dir$f" ] || missing="$missing $f"
            done
            # default 模板没有自带 style.css —— 它复用站点公共的 static/style.css，
            # 这是刻意设计（tplEditorVars() 对 default 有专门回落），不算缺失。
            if [ "$tpl" != "default" ]; then
              [ -f "$dir/style.css" ] || missing="$missing style.css"
            fi
            if [ -n "$missing" ]; then
              echo "::error title=模板 $tpl 缺少文件::$missing"
              echo "❌ $tpl 缺少:$missing"
              fail=1
            else
              echo "✅ $tpl"
            fi
          done

          # 反向检查：非 default 模板里不该再有与 default 逐字节相同的文件
          # —— 那正是这次去重要消灭的重复；出现说明有人复制过去了。
          echo ""
          dup=0
          for dir in templates/*/; do
            tpl=$(basename "$dir")
            [ "$tpl" = "default" ] && continue
            while IFS= read -r f; do
              rel="${f#./}"
              if [ -f "templates/default/$rel" ] && cmp -s "templates/default/$rel" "$rel"; then
                echo "::error::模板 $tpl 里的 $rel 与 default 完全相同 —— 应删除并回退 default"
                dup=1
              fi
            done < <(find "$dir" -type f -name '*.php')
          done
          [ "$dup" -eq 0 ] && echo "✅ 没有与 default 逐字节相同的模板文件"
          exit $((fail + dup))

      - name: 行为测试（零依赖断言）
        run: |
          set -euo pipefail
          # 本项目零 Composer，所以测试也是零依赖的纯 PHP 断言脚本。
          # 详见 tests/bootstrap.php 文件头的说明：引入 PHPUnit 会给每个
          # 部署实例凭空加一个 vendor/ 目录，与零依赖战略冲突。
          php tests/run.php

      - name: 验证闭环自检（含注入回归）
        run: |
          set -euo pipefail
          # 逻辑放在 tests/ci-check.php 而不是写在 YAML 里 ——
          # YAML 嵌多行 PHP 会被缩进规则搞乱（本项目踩过一次）。
          #
          # 这一步做两件事：
          #   ① 读 --json 的确切数字，核对 pass + fails == total；
          #   ② **注入回归**：故意改坏十二处，确认每一处都会让测试变红，
          #      且还原后逐字节回到原样。
          #      一个不会变红的测试等于没有测试 —— 本项目踩过
          #      「注释掉 global 后回归测试依然全绿」的坑。
          #
          #      1.3.11 从 4 处扩到 8 处，1.3.12 扩到 10 处，1.3.13 扩到 12 处，
          #      1.5.5 之后扩到 13 处（第 13 条 = 本文件自己：契约 15 的比对对象）。
          #      每条新增注入都对应一次真实事故，
          #      选取标准与对应关系见 tests/ci-check.php 的文件头。
          php tests/ci-check.php

  # ---------------------------------------------------------------
  # 结构自检：确保关键文档与配置都在
  # ---------------------------------------------------------------
  docs:
    name: 文档与配置完整性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 必需文件检查
        run: |
          set -euo pipefail
          required="README.md LICENSE CONTRIBUTING.md SECURITY.md CHANGELOG.md CODE_OF_CONDUCT.md .gitignore .htaccess config.php"
          fail=0
          for f in $required; do
            if [ -f "$f" ]; then echo "✅ $f"; else echo "❌ 缺少 $f"; fail=1; fi
          done
          exit $fail

      - name: 运行期目录已忽略
        run: |
          grep -q '^/runtime/$' .gitignore \
            || { echo "::error::.gitignore 未忽略 runtime/，存在泄露密码哈希风险"; exit 1; }
          echo "✅ .gitignore 正确忽略 runtime/"

      - name: README 内链接可达
        run: |
          set -euo pipefail
          # README 中的相对链接指向的文件必须存在（锚点与外链不检查）
          fail=0
          grep -oE '\]\([^)#]+\)' README.md | sed 's/](\(.*\))/\1/' \
            | grep -vE '^(https?:|mailto:)' | sort -u \
            | while read -r link; do
                [ -e "$link" ] || { echo "❌ README 链接失效: $link"; fail=1; }
              done
          echo "✅ README 相对链接检查完成"

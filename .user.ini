; VodHub 1.3.0 —— 生产环境 PHP 配置（极致低功耗模式 · 支柱五）
;
; .user.ini 只在 CGI / FPM / LSAPI 下生效；**mod_php 主机读不到它**。
;
; ⚠️ 1.3.3 起 `.htaccess` **不再写 php_value / php_flag** —— 那些指令需要
;    `AllowOverride Options`，多数免费虚拟空间只给 `FileInfo`，会导致**整站 500**。
;    所以 mod_php 主机现在**只靠 includes/guard.php 的运行时 ini_set()** 兜底
;    （display_errors / display_startup_errors / log_errors / error_log）。
;    三层里本文件管 CGI/FPM，guard.php 管全部 SAPI —— 缺哪一层都不会外显错误。
;
; 这一份**不改 config.php** —— config.php 里那句 ini_set('display_errors','1')
; 是给本地排障用的，生产环境交给主机配置覆盖。

; ---- 错误输出 ----
; display_errors=On 会让 warning 的字节混进 img.php 的图片流（该文件开头那段
; BOM 防护注释说明作者已经踩过同类问题），也会向访客暴露绝对路径。
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
; 日志必须落在 runtime/ 下，并由 includes/guard.php 截断到 2 MB ——
; 只开 log_errors 不设路径与截断，等于「修好了显示问题却造了个日志炸弹」。
error_log = runtime/php-errors.log

; ---- OPcache ----
; 虚拟主机常见 opcache.validate_timestamps=0（永不自动重新校验），
; 表现是「传完文件前台还是旧代码，等多久都没用」。这里显式打开重新校验。
; 若主机把这几项锁成 PHP_INI_SYSTEM，本文件的设置会被安全忽略，
; 那种情况下请用后台的「清理系统缓存 → 重置 OPcache」按钮。
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.memory_consumption = 128

; ---- 会话 ----
; 某些免费主机会把 session.gc_probability 设为 0（会话文件永不回收）。
; includes/guard.php 在检测到这种情况、且会话目录位于本站内时会主动补清。
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 86400
